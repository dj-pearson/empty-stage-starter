# project_id = "<your-project-id>"  # Old hosted Supabase
# Self-hosted Coolify Supabase - use direct DB connection
# API URL: https://api.tryeatpal.com
# DB: 209.145.59.219:5434

# Auth Configuration
[auth]
# Email provider configuration
enable_signup = true

# Edge Functions Configuration
#
# The repo carries two function trees (see scripts/ci/check-function-trees.sh):
# supabase/functions/ is what the deployed edge-functions-server serves, and
# functions/ holds the Agentic OS (serve()-style, Deno CLI shape). The CLI
# resolves a bare [functions.NAME] to supabase/functions/NAME/index.ts, so every
# entry that only exists in the second tree needs an explicit `entrypoint` —
# without it `supabase start` aborts with "failed to read file: open
# supabase/functions/<name>/index.ts", which is what kept the Migration Test and
# Types Drift jobs red.
#
# Keep `verify_jwt` on the line directly after the [functions.NAME] header: the
# US-533 guard (functions/_shared/verify-jwt-guard_test.ts) parses that pair.
[functions.health-check]
verify_jwt = false
entrypoint = "../functions/health-check/index.ts"
# Agentic OS dispatcher: no JWT (called by pg_cron); guarded by an internal
# shared secret (AGENT_DISPATCH_SECRET) checked inside the function.
[functions.agent-dispatcher]
verify_jwt = false
entrypoint = "../functions/agent-dispatcher/index.ts"
# Agentic OS knowledge-base ingest: JWT-authenticated, admin-gated inside the fn.
[functions.agent-knowledge-ingest]
verify_jwt = true
entrypoint = "../functions/agent-knowledge-ingest/index.ts"
# Agentic OS approval executor: no JWT gate at the edge; the function itself
# accepts the internal dispatch secret (sweep) OR an admin JWT (execute).
[functions.approval-executor]
verify_jwt = false
entrypoint = "../functions/approval-executor/index.ts"
# Agentic OS digest: no JWT; called only by pg_cron / DB trigger with the
# internal dispatch secret checked inside the function.
[functions.agent-digest]
verify_jwt = false
entrypoint = "../functions/agent-digest/index.ts"
# Support intake: public contact form (anonymous allowed); optional JWT links
# the ticket to the user; rate-limited per email inside the function.
