# project_id = "<your-project-id>"  # Old hosted Supabase
# Self-hosted Coolify Supabase - use direct DB connection
# API URL: https://api.tryeatpal.com
# DB: 209.145.59.219:5434

# Auth Configuration
[auth]
# Email provider configuration
enable_signup = true

# Edge Functions Configuration
[functions.health-check]
verify_jwt = false
# Agentic OS dispatcher: no JWT (called by pg_cron); guarded by an internal
# shared secret (AGENT_DISPATCH_SECRET) checked inside the function.
[functions.agent-dispatcher]
verify_jwt = false
# Agentic OS knowledge-base ingest: JWT-authenticated, admin-gated inside the fn.
[functions.agent-knowledge-ingest]
verify_jwt = true
# Agentic OS approval executor: no JWT gate at the edge; the function itself
# accepts the internal dispatch secret (sweep) OR an admin JWT (execute).
[functions.approval-executor]
verify_jwt = false
# Agentic OS digest: no JWT; called only by pg_cron / DB trigger with the
# internal dispatch secret checked inside the function.
[functions.agent-digest]
verify_jwt = false
# Support intake: public contact form (anonymous allowed); optional JWT links
# the ticket to the user; rate-limited per email inside the function.
[functions.support-intake]
verify_jwt = false
# Support triage agent: invoked by the dispatcher with the internal secret.
[functions.agent-support-triage]
verify_jwt = false
# RAG support answer agent: invoked by the dispatcher with the internal secret.
[functions.agent-support-answer]
verify_jwt = false
# Bug-reporter agent: invoked by the dispatcher with the internal secret.
[functions.agent-bug-reporter]
verify_jwt = false
# Support reply intake: inbound (internal secret) or admin reply/resolve (admin JWT).
[functions.support-reply-webhook]
verify_jwt = false
# CSAT follow-up agent: invoked by the dispatcher with the internal secret.
[functions.agent-csat]
verify_jwt = false
# Public CSAT rating endpoint: the signed token is the authorization.
[functions.csat-rate]
verify_jwt = false
[functions.calculate-food-similarity]
verify_jwt = true

[functions.suggest-foods]
verify_jwt = true

[functions.suggest-recipe]
verify_jwt = true

[functions.ai-meal-plan]
verify_jwt = true

[functions.test-ai-model]
verify_jwt = true

[functions.test-ai-configuration]
verify_jwt = true

[functions.generate-blog-content]
verify_jwt = false

[functions.generate-social-content]
verify_jwt = false

[functions.test-blog-webhook]
verify_jwt = false

[functions.update-blog-image]
verify_jwt = false

[functions.generate-image]
verify_jwt = false

[functions.parse-recipe]
verify_jwt = false

[functions.generate-sitemap]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false
