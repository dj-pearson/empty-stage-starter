<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      IMPORTANT: every tag below that SEOHead also emits carries data-rh="true".
      react-helmet-async claims and removes tags marked with that attribute when it
      mounts, so the runtime head REPLACES these defaults instead of appending a
      second, contradicting copy of them. Without it the DOM ends up with two
      og:title/og:description/canonical tags and social scrapers read the first one.

      These defaults describe the HOMEPAGE, because index.html is also the SPA
      fallback document. They are pinned to seoConfig.home by
      tests/seo-static-head.test.ts — change them in src/lib/seo-config.ts, not here.
    -->
    <title data-rh="true">EatPal: ARFID &amp; Picky Eater Meal Planner | Food Chaining Science</title>
    <meta data-rh="true" name="title" content="EatPal: ARFID &amp; Picky Eater Meal Planner | Food Chaining Science" />
    <meta data-rh="true" name="description" content="AI meal planning for ARFID, extreme picky eating, and autism-related feeding challenges. Built on food chaining, the feeding-therapy method that grows a child&#39;s diet by changing one attribute at a time. Start free." />
    <meta data-rh="true" name="author" content="EatPal Team" />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical URL -->
    <link data-rh="true" rel="canonical" href="https://tryeatpal.com/" />

    <!-- RSS and Atom Feeds - content syndication and feed readers -->
    <link data-rh="true" rel="alternate" type="application/rss+xml" title="EatPal Blog RSS Feed" href="https://tryeatpal.com/rss.xml" />
    <link data-rh="true" rel="alternate" type="application/atom+xml" title="EatPal Blog Atom Feed" href="https://tryeatpal.com/feed.xml" />

    <!-- Open Graph / Facebook -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://tryeatpal.com/" />
    <meta data-rh="true" property="og:site_name" content="EatPal - Kids Meal Planning for Picky Eaters" />
    <meta data-rh="true" property="og:title" content="EatPal: ARFID &amp; Picky Eater Meal Planner | Food Chaining Science" />
    <meta data-rh="true" property="og:description" content="AI meal planning for ARFID, extreme picky eating, and autism-related feeding challenges. Built on food chaining, the feeding-therapy method that grows a child&#39;s diet by changing one attribute at a time. Start free." />
    <meta data-rh="true" property="og:image" content="https://tryeatpal.com/Cover.webp" />
    <meta data-rh="true" property="og:image:secure_url" content="https://tryeatpal.com/Cover.webp" />
    <meta data-rh="true" property="og:image:width" content="1536" />
    <meta data-rh="true" property="og:image:height" content="1024" />
    <meta data-rh="true" property="og:image:alt" content="EatPal - AI-Powered Kids Meal Planning for Picky Eaters" />
    <meta data-rh="true" property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:url" content="https://tryeatpal.com/" />
    <meta data-rh="true" name="twitter:site" content="@eatpal" />
    <meta data-rh="true" name="twitter:creator" content="@eatpal" />
    <meta data-rh="true" name="twitter:title" content="EatPal: ARFID &amp; Picky Eater Meal Planner | Food Chaining Science" />
    <meta data-rh="true" name="twitter:description" content="AI meal planning for ARFID, extreme picky eating, and autism-related feeding challenges. Built on food chaining, the feeding-therapy method that grows a child&#39;s diet by changing one attribute at a time. Start free." />
    <meta data-rh="true" name="twitter:image" content="https://tryeatpal.com/Cover.webp" />
    <meta data-rh="true" name="twitter:image:alt" content="EatPal - AI-Powered Kids Meal Planning for Picky Eaters" />

    <!--
      Brand-identity structured data only. Everything page-specific (SoftwareApplication,
      FAQPage, WebPage, Breadcrumb) is owned by the schema components in
      src/components/schema/ and is baked into the static HTML by the prerender step,
      so it is NOT duplicated here. Deliberately NOT marked data-rh: Helmet manages the
      `script` tag type on pages that pass structuredData, and would otherwise delete this.
    -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://tryeatpal.com/#organization","name":"EatPal","url":"https://tryeatpal.com","logo":"https://tryeatpal.com/Logo-Green.webp","description":"EatPal is a meal planning platform that applies food chaining therapy to help parents systematically expand their child's diet. Evidence-based approach for picky eaters, ARFID, and selective eating.","sameAs":["https://facebook.com/eatpal","https://twitter.com/eatpal","https://instagram.com/eatpal"],"contactPoint":{"@type":"ContactPoint","contactType":"Customer Support","email":"support@tryeatpal.com","availableLanguage":"English"}},{"@type":"WebSite","@id":"https://tryeatpal.com/#website","url":"https://tryeatpal.com","name":"EatPal","description":"AI-powered meal planning for ARFID, extreme picky eating, and autism-related feeding challenges, built on food chaining science","publisher":{"@id":"https://tryeatpal.com/#organization"},"inLanguage":"en-US"}]}
    </script>

    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EatPal" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts are self-hosted via @fontsource packages (imported in main.tsx) -->
    <!-- No external font CDN requests needed - improves performance and privacy -->

    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://api.tryeatpal.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://analytics.google.com">

    <!-- Prefetch common routes for faster navigation -->
    <link rel="prefetch" href="/pricing" as="document">
    <link rel="prefetch" href="/auth" as="document">

    <!-- Preload critical above-the-fold images -->
    <link rel="preload" href="/Logo-Green.webp" as="image" type="image/webp">

    <!-- Favicon - Multiple formats for broad browser support -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 0 auto;">
        <h1 style="color: #10b981; margin-bottom: 1rem;">EatPal - Meal Planning for Picky Eaters &amp; ARFID</h1>
        <p style="color: #6b7280; margin-bottom: 1.5rem;">
          EatPal is an AI-powered meal planning app for families with picky eaters, ARFID, and selective eating challenges.
          Our platform uses food chaining science to help children expand their food acceptance.
        </p>
        <p style="color: #374151; margin-bottom: 1rem;">
          <strong>Key Features:</strong>
        </p>
        <ul style="text-align: left; color: #6b7280; padding-left: 1.5rem;">
          <li>AI-powered meal planning built on food chaining methodology</li>
          <li>Food chaining suggestions based on texture and flavor matching</li>
          <li>Multi-child meal planning with allergen tracking</li>
          <li>Auto-generated grocery lists organized by category</li>
          <li>Progress tracking and nutrition analytics</li>
          <li>Professional tools for feeding therapists</li>
        </ul>
        <p style="color: #dc2626; margin-top: 1.5rem;">
          Please enable JavaScript to use the EatPal application.
        </p>
        <p style="color: #6b7280; font-size: 0.875rem; margin-top: 1rem;">
          Contact us at <a href="mailto:support@tryeatpal.com" style="color: #10b981;">support@tryeatpal.com</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Analytics - Deferred to user interaction or 5s to avoid blocking LCP/FCP.
         Externalized to /ga-loader.js so the page carries no inline <script> and the CSP
         can drop 'unsafe-inline'/'unsafe-eval' from script-src (US-529). -->
    <script src="/ga-loader.js" defer></script>
  </body>
</html>
