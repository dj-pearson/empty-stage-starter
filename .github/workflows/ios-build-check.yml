name: iOS Build Check

# Compiles and tests the iOS app on any branch that touches ios/**.
#
# Why this exists: `ios-app-store-deploy.yml` is the only workflow that ever
# builds Swift, and it fires solely on a push to `develop` or a manual dispatch.
# So iOS code written on a `claude/*` or `hotfix/*` branch reached `develop`
# having never been near a compiler, and the first thing to notice a bad
# `switch` or a renamed API was a deploy run. This is the missing feedback:
# no signing, no secrets, no upload, just "does it build and do the tests pass".
#
# Deliberately NOT a copy of the preflight job. It skips the plist/profile
# checks and the archive path, which only matter when something is actually
# being shipped, and it runs without any repository secret so it works on a
# fork and on a branch.
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'
  workflow_dispatch:

# One run per branch; a new push supersedes an in-flight build.
concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.2'
  SCHEME: 'EatPal'
  PROJECT_DIR: 'ios/EatPal'

jobs:
  build-and-test:
    name: Build + unit tests (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          XCODE_APP="/Applications/Xcode_${{ env.XCODE_VERSION }}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::warning::Xcode ${{ env.XCODE_VERSION }} not found. Falling back to the latest installed Xcode."
            XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
            if [ -z "$XCODE_APP" ]; then
              echo "::error::No Xcode installation found on runner."
              exit 1
            fi
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('ios/EatPal/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift Package Manager dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -resolvePackageDependencies \
            -project EatPal.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache"

      # Building the EatPal target pulls in the share and widget extensions,
      # which is the point: Shared/ is compiled into all three, and a change
      # that only breaks the extension is exactly the kind this job is here to
      # catch. The Supabase URL and key are placeholders; nothing here talks to
      # a server.
      - name: Build (simulator, Debug, unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project EatPal.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
            -resultBundlePath "$RUNNER_TEMP/BuildCheck.xcresult" \
            SUPABASE_URL="https://placeholder.supabase.co" \
            SUPABASE_ANON_KEY="placeholder-key-for-ci-build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          SIM_DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; print(next(d['udid'] for r in devs for d in devs[r] if 'iPhone' in d['name'] and d['isAvailable']),end='')" 2>/dev/null || true)
          if [ -z "$SIM_DEVICE" ]; then
            echo "::error::No available iPhone simulator on the runner, so the tests did not run."
            exit 1
          fi
          echo "Using simulator: $SIM_DEVICE"
          xcodebuild test \
            -project EatPal.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_DEVICE" \
            -configuration Debug \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            SUPABASE_URL="https://placeholder.supabase.co" \
            SUPABASE_ANON_KEY="placeholder-key-for-ci-build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-check-xcresult
          path: |
            ${{ runner.temp }}/BuildCheck.xcresult
            ${{ runner.temp }}/Tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
