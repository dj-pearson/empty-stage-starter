name: android-native-ci

on:
  push:
    # US-763: was [main, develop]; develop is no longer an integration branch.
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-ci.yml'
  # Callable by the prd-verify workflow so PRD story verification reuses this
  # real build+test gate instead of duplicating the Gradle pipeline.
  workflow_call:
  # The path filters above mean this never runs on a branch that only touches
  # web/CI files, so there is no way to confirm the Gradle gate still builds
  # without pushing a no-op Android change. Dispatch covers that.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is `tools platform-tools`, and Google removed
          # `tools` from the SDK repository -- it has been deprecated in favour
          # of cmdline-tools for years. sdkmanager answers "Failed to find
          # package 'tools'" and exits 1, which fails the whole job before
          # Gradle starts.
          #
          # This job last ran green on 2026-08-14 and then did not run at all
          # until now, because its path filters only fire on android-native/**
          # or on this file. So the breakage is upstream and has been latent
          # for a month; nothing in this PR's Android code caused it, and
          # nothing on main would have reported it either.
          #
          # platform-tools still exists and is kept. Gradle downloads the
          # platform and build-tools it needs on its own.
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-native/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-native/**/*.gradle*', 'android-native/**/gradle-wrapper.properties', 'android-native/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Write env.local.properties (placeholders only)
        run: |
          cat > ../env.local.properties <<'EOF'
          SUPABASE_URL=https://api.tryeatpal.com
          SUPABASE_ANON_KEY=REPLACE_WITH_YOUR_ANON_KEY
          SENTRY_DSN=
          GOOGLE_WEB_CLIENT_ID=
          EOF

      - name: Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      # lintDebug aborts on errors but only prints the FIRST one to the console.
      # Dump the full text report so every lint error is visible in the Actions
      # log (the HTML artifact isn't reachable from every environment).
      - name: Print lint report on failure
        if: failure()
        run: |
          f=$(find app/build -name 'lint-results-debug.txt' 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "=== $f ==="; cat "$f"; else echo "No lint text report found."; fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
