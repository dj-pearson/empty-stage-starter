name: PRD Verify

# Verifies prd.json user stories that can't be checked in a local Linux/web
# sandbox by running the REAL CI gates (web build+test, iOS build+test, Android
# build+test), then setting `passes: true` on a story ONLY when the story NAMES
# the checks that prove it and every one of them ran and passed in this run.
#
# US-792 replaced the old rule, which was "a commit message mentions US-XXX"
# AND "the platform job returned success". Neither fact says an acceptance
# criterion was met: it flipped a Postgres-migration story on a green iOS gate,
# flipped a story during a run where that story's own a11y scan was failing
# inside a continue-on-error job, and on a PR containing two YAML files it
# flipped fourteen stories including US-792 itself. The rule now lives in
# scripts/ralph/verify-criteria.mjs with that history attached.
#
# A story opts in by declaring what proves it:
#
#   "verifiedBy": { "checks": ["Web gate (strict) / Unit tests", "Migration Test"] }
#
# Names address this run's jobs ("Migration Test") and steps ("Job / Step").
# Naming a STEP is what defeats continue-on-error masking, because the job can
# be green while the step is red. `"autoVerify": false` holds a story open
# regardless. No declaration means no flip, so this writes nothing until
# stories opt in -- the report says what each one needs.
#
# Entry points:
#  - pull_request -> main: a PR touching a verification surface (iOS, Android,
#    web src, prd.json, or these workflows) runs the gates and commits any
#    resulting flips ONTO THE PR BRANCH, so flags only change through review,
#    never a direct push to protected main.
#  - workflow_dispatch: same pipeline on demand, with a dry-run option.
# The flip commit carries [skip ci] and is pushed by GITHUB_TOKEN, so it can't
# loop back and re-trigger CI.

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'android-native/**'
      - 'src/**'
      - 'prd.json'
      - 'prd-*.json'
      - 'scripts/ralph/verify-stories.mjs'
      - '.github/workflows/prd-verify.yml'
      - '.github/workflows/ios-ci.yml'
      - '.github/workflows/android-native-ci.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write flips back to prd.json/progress.txt (false = dry-run report only)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: prd-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-gate:
    name: Web gate (strict)
    runs-on: ubuntu-latest
    # 25 was not enough and killed this job mid-typecheck (started 05:07:55,
    # killed 05:33:10, conclusion "cancelled" — a timeout reads as a cancellation,
    # not a failure, which is what made it look like a push had superseded the
    # run). `tsc -b` alone takes ~24.5 min here: the TS2589 "type instantiation is
    # excessively deep" errors in src/pages/pseo force the checker to grind
    # through the whole 240-table generated Database union on every .from() call.
    # Regenerating src/integrations/supabase/types.ts should collapse both the
    # error count and this runtime; until then, leave headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # STRICT (unlike ci.yml's non-blocking backlog gates): a web story
      # (US-342 ban `any`, US-344 select-column hot paths) only counts as
      # verified when typecheck + lint + tests + build are genuinely clean.
      # Ratcheted for the same reason as the lint step below: `npm run typecheck`
      # reports 1256 pre-existing errors (US-545 backlog, baseline 1257), so a
      # strict run pinned this gate red no matter what a story actually changed.
      # The ratchet still fails on any net-new type error.
      - name: Typecheck ratchet
        run: bash scripts/ci/typecheck-ratchet.sh
      # Ratcheted rather than strict: the US-342 backlog is ~1.2k pre-existing
      # eslint errors across tools/, coolify-migration/, supabase/functions/ and
      # src/. A plain `npm run lint` here just pinned this gate red forever, which
      # made every story look unverified regardless of its own quality. The
      # ratchet still blocks net-new lint debt (same contract as the typecheck
      # ratchet in ci.yml), and typecheck/tests/build below stay genuinely strict.
      - name: Lint ratchet
        run: bash scripts/ci/lint-ratchet.sh
      - name: Unit tests
        run: npm run test:run
      - name: Build
        run: npm run build

  ios-gate:
    name: iOS gate
    uses: ./.github/workflows/ios-ci.yml

  android-gate:
    name: Android gate
    uses: ./.github/workflows/android-native-ci.yml

  flip:
    name: Flip verified stories
    runs-on: ubuntu-latest
    needs: [web-gate, ios-gate, android-gate]
    if: ${{ always() }}
    # US-792: a story is flipped only when it NAMES the checks that prove it
    # and every one of them passed in this run. The old rule -- "a commit
    # mentions the id" AND "the platform job was green" -- flipped fourteen
    # stories on a PR whose entire content was two YAML files, US-792 itself
    # among them. See scripts/ralph/verify-criteria.mjs for the rule and the
    # rest of that history.
    #
    # Writing is on again because the rule is now falsifiable. A story with no
    # verifiedBy.checks is never flipped, so this writes nothing until stories
    # opt in; the report says what each one needs.
    env:
      APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply == false) && 'false' || 'true' }}
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head branch (not the detached merge ref) so flips
          # can be pushed back onto it.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The evidence. Job results alone cannot answer US-792 AC2: the E2E job
      # carries continue-on-error, so it reports success while a scan inside it
      # fails. STEP conclusions still say failure, so the engine is handed both
      # and a story names whichever one actually proves it.
      - name: Collect this run's check results
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No --paginate: with a --jq filter that builds an object, each page
          # is emitted as its own object and the concatenation is not valid
          # JSON. per_page=100 covers a run of this size several times over.
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '{jobs: [.jobs[] | {name, conclusion, steps: [(.steps // [])[] | {name, conclusion}]}]}' > prd-verify-checks.json
          echo "### Checks visible to prd-verify" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const run = require("./prd-verify-checks.json");
            for (const job of run.jobs) {
              console.log(`${job.name}: ${job.conclusion}`);
              for (const step of job.steps) console.log(`  ${job.name} / ${step.name}: ${step.conclusion}`);
            }
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      # One engine run per PRD at the repo root: the main prd.json plus every
      # epic file (prd-kitchen-loop.json, prd-household-planner.json, ...).
      # Epics are separate files so a loop can target one without touching the
      # main backlog; the flip step still verifies all of them on each run.
      #
      # The glob is expanded ONCE, before the loop body runs, so the
      # *-verify-report.json files written inside the loop cannot be picked up
      # as PRDs on a later iteration. It is guarded anyway.
      - name: Run verification engine
        env:
          VERIFY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKS_FILE: prd-verify-checks.json
        run: |
          for prd in prd.json prd-*.json; do
            case "$prd" in *-verify-report.json|prd-verify-checks.json) continue ;; esac
            [ -f "$prd" ] || continue
            if [ "$APPLY" = "false" ]; then
              PRD_FILE="$prd" node scripts/ralph/verify-stories.mjs | tee -a "$GITHUB_STEP_SUMMARY"
            else
              PRD_FILE="$prd" node scripts/ralph/verify-stories.mjs --apply | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Commit flipped flags
        if: ${{ env.APPLY != 'false' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # US-792 AC7: enumerate TRACKED files rather than globbing. The
          # step before this one writes prd-verify-report.json, its two
          # siblings and prd-verify-checks.json into the working directory,
          # and all of them are gitignored. The old line let the SHELL expand
          # `prd-*.json`, which named those ignored files explicitly, and
          # `git add` exits 1 on an explicitly named ignored path -- under
          # `set -e` that failed the step on every run that had a story to
          # flip. git ls-files cannot name an untracked file at all.
          mapfile -t PRD_PATHS < <(git ls-files -- 'prd.json' 'prd-*.json' 'progress.txt')
          if [ ${#PRD_PATHS[@]} -eq 0 ]; then
            echo "::error title=No PRD files tracked::git ls-files matched nothing; refusing to guess"
            exit 1
          fi
          echo "tracked PRD files: ${PRD_PATHS[*]}"

          if git diff --quiet -- "${PRD_PATHS[@]}"; then
            echo "No stories flipped — nothing to commit."
            exit 0
          fi
          git add -- "${PRD_PATHS[@]}"
          git commit -m "chore(prd): flip CI-verified stories to passes=true [skip ci]"

          # Retry a few times for transient network/ref races. The loop used to
          # fall out after four failures and let the step report success, so a
          # push that never landed read as a green run with flipped flags that
          # existed only on the runner.
          n=0
          until [ $n -ge 4 ]; do
            git push origin "HEAD:${TARGET_BRANCH}" && exit 0
            n=$((n+1))
            echo "push failed, retry $n…"; sleep $((2 ** n))
            git pull --rebase origin "${TARGET_BRANCH}" || true
          done
          echo "::error title=PRD flip not pushed::could not push the flipped flags to ${TARGET_BRANCH} after 4 attempts"
          exit 1

      - name: Upload verification report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prd-verify-report
          path: '*verify-report.json'
          if-no-files-found: ignore
          retention-days: 30
