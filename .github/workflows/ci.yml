name: Web CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_edge_tests:
        description: 'Run the critical edge-function suite (needs a local Supabase; informational)'
        type: boolean
        default: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the diff-scoped no-new-any gate can reach the base ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # US-614: committed-credential gate. HARD gate from day one — unlike the
      # lint/typecheck backlogs there is nothing pre-existing to burn down, and
      # a leaked key cannot be fixed after the fact by editing the file.
      - name: Check for committed secrets
        run: bash scripts/ci/check-committed-secrets.sh

      # US-622: keep the two edge-function trees from drifting. A function name
      # living in both trees is how the US-519 Stripe idempotency work ended up
      # in the tree the live server cannot load — it never deployed, and the
      # dedup table shipped empty for a month.
      - name: Check edge-function trees
        run: bash scripts/ci/check-function-trees.sh

      # US-638: a component rendered but never imported is a ReferenceError on
      # whatever path renders it, and it has shipped four times -- <Input>
      # breaking six admin SEO tabs, and <AlertDialogTrigger> crashing the kid
      # editor for two months. HARD gate: nothing pre-existing to burn down
      # (the check is clean across all 383 components as of this commit), and
      # nothing else catches it. ESLint's no-undef is off for TS, and tsc does
      # report it but the typecheck step is a count-based ratchet, so one more
      # TS2304 hides inside the backlog counted in .ci/typecheck-baseline.txt.
      - name: Check components are imported
        run: node scripts/ci/check-jsx-imports.mjs

      # The other direction (US-771): a component nothing imports at all.
      # Reachability from src/main.tsx, not a direct-importer count -- a ring of
      # dead files that import each other keeps every member "imported" forever,
      # which is how all five of src/components/billing/ stayed invisible.
      - name: Check components are reachable
        run: node scripts/ci/check-orphan-components.mjs

      # US-553 split SEOManager (5593 lines) into 13 tab components and 8
      # hooks. The whole-file typecheck is a count-based ratchet, so a
      # TS2304 introduced by that kind of move hides inside the backlog
      # counted in .ci/typecheck-baseline.txt; this narrows to
      # src/components/admin/seo/ and fails on
      # undefined identifiers alone. It has existed since US-553 and was
      # only ever reachable as `npm run typecheck:seo` -- a gate nobody
      # runs gates nothing, which is the same failure as the tsconfig
      # include that left it inert for three commits.
      - name: Typecheck the extracted SEO components
        run: bash scripts/ci/check-seo-extraction.sh

      # US-646/US-647: the same shape for the /compare cluster. Scoped to the
      # files those stories own, and it fails on any type error originating in
      # them rather than on a clean whole-app compile, which does not finish in
      # this container.
      - name: Typecheck the comparison pages
        run: bash scripts/ci/check-seo-pages.sh

      # A bucket created by clicking in the dashboard exists only in
      # production: its public flag and RLS policies cannot be read from the
      # repo, a follow-up migration has to be written blind, and a fresh
      # environment comes up without it. That is how `images` -- every kid
      # photo the iOS app uploads -- went unnoticed until someone read the
      # Swift client. This gate found a second one the first time it ran
      # (`Assets`, serving the lead-magnet PDF). Both are tracked in the
      # script's PENDING list against the story that will declare them; that
      # list should only ever shrink.
      - name: Check storage buckets are declared
        run: node scripts/ci/check-storage-buckets.mjs

      # A published post's featured image is its og:image, its Article schema
      # `image` and its on-page hero all at once, so one dead URL costs the
      # search-result thumbnail, every social preview, Discover eligibility and
      # renders "Image unavailable" mid-article. Four of the twenty
      # highest-impression posts were serving an image that 400s from Supabase
      # storage, and nothing caught it: the column was populated, so the null
      # fallback in BlogPost.tsx never fired. WARN-ONLY for now -- the four
      # existing breakages need the images re-uploaded, which is a content task,
      # and a hard gate would block every unrelated PR until then. Flip to a
      # hard gate (drop --warn) once the run is clean.
      - name: Check blog featured images resolve
        run: node scripts/ci/check-blog-images.mjs --warn
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # CLAUDE.md records that backup-databases.ps1 and ssl-check.ps1 sat
      # unparseable for months. Nothing in this repo ever runs a .ps1 -- CI is
      # Node, deploys are Cloudflare and EAS -- so a syntax error surfaces when
      # someone reaches for the script on a Windows box, which is always the
      # worst moment. pwsh is preinstalled on ubuntu-latest, so the parser is
      # free. Currently 15 files, all parsing.
      - name: Check PowerShell scripts parse
        run: bash scripts/ci/check-powershell-parses.sh

      # CLAUDE.md's "plain characters only" rule, as a check rather than a
      # document. Invisible and bidi characters are the one class review cannot
      # catch -- they render as nothing while the parser sees something else.
      # HARD gate: the tree is clean as of this commit. Two real instances were
      # removed to get there (a zero-width space joining a search haystack in
      # hiddenVeggieRewriter, and one holding a JSDoc block open in
      # agentConfig), plus BOMs on 15 generated files. Emoji ZWJ sequences are
      # allowed; a deliberate use declares itself with `invisible-chars: allow`.
      - name: Check for invisible characters
        run: node scripts/ci/check-invisible-chars.mjs

      # US-700: the signup confirmation email must carry the 6-digit code the
      # OTP screen in src/pages/Auth.tsx asks for. GoTrue renders a custom
      # template only when GOTRUE_MAILER_TEMPLATES_CONFIRMATION points at one;
      # on production that variable was empty, so it sent its stock link-only
      # mail and the code the UI demanded existed nowhere. 35 of the first 200
      # accounts never reached a session. Nothing in the repo could see it --
      # both templates were correct and the bug was one unset env var.
      # This asserts the placeholder survives, and when the repo variable
      # AUTH_CONFIRMATION_TEMPLATE_URL is set it also fetches the URL GoTrue is
      # pointed at. Unset, it exits 0, so forks and secretless PR runs pass.
      - name: Check auth email templates
        env:
          AUTH_TEMPLATE_BASE_URL: ${{ vars.AUTH_TEMPLATE_BASE_URL }}
        run: node scripts/ci/check-auth-email-templates.mjs

      # US-641: the DB is shared with every shipped iOS build still on a phone,
      # so CLAUDE.md forbids DROP COLUMN / DROP TABLE / RENAME / SET NOT NULL in
      # a single migration. Those rules lived only in a document. DIFF-SCOPED to
      # migrations added on the branch, so the existing tree (notably the 2026-05
      # scaffold-table drop) is untouched, and a deliberate case declares itself
      # with `-- migration-safety: allow <token> (<reason>)`.
      - name: Check migration safety
        run: bash scripts/ci/check-migration-safety.sh "origin/${{ github.base_ref || 'main' }}"

      # ESLint. The repo carries a large PRE-EXISTING lint backlog (mostly
      # @typescript-eslint/no-explicit-any and unused caught-errors — see
      # US-342). The no-console rule (US-343) is fully satisfied. This used to be
      # a continue-on-error step that always exited 0, so nothing stopped the
      # backlog growing. It is now a RATCHET on .ci/lint-baseline.txt, same
      # contract as the typecheck ratchet below: the count can only shrink. When
      # it hits 0, set the baseline to 0 and promote `npm run lint` to a plain
      # hard gate.
      - name: Lint ratchet
        run: bash scripts/ci/lint-ratchet.sh

      # Real type-check (the old `tsc --noEmit` checked zero files — root
      # tsconfig has files:[]). `npm run typecheck` runs `tsc -b` over the
      # referenced projects. There is a large PRE-EXISTING backlog of type
      # errors (mostly from a stale generated src/integrations/supabase/types.ts
      # — regenerated in the `types-and-functions` job). Until that backlog is
      # burned down this step is NON-BLOCKING: it surfaces errors as a warning
      # annotation but does not fail the pipeline, so merges stay unblocked.
      # Flip `continue-on-error` to false (hard gate) once the count hits zero.
      # US-545: typecheck error-count RATCHET. Runs tsc -b once and FAILS only if
      # the error count grows beyond .ci/typecheck-baseline.txt — the backlog can
      # only shrink, never grow. When it hits 0, drop this and make
      # `npm run typecheck` a plain hard gate. (Plan to shrink the backlog +
      # tsconfig-bypass.json: docs/typecheck-backlog.md.)
      - name: Typecheck ratchet
        run: bash scripts/ci/typecheck-ratchet.sh

      # US-545: fail on newly-introduced explicit `any` in changed src/ files
      # (diff-scoped; the pre-existing backlog is untouched).
      - name: No new explicit any (diff-scoped)
        run: bash scripts/ci/no-new-any.sh "origin/${{ github.base_ref || github.event.repository.default_branch }}"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # `npm run build`, not `npx vite build`. They are different builds and the
      # difference is the whole of US-570.
      #
      # `vite build` stops at the SPA shell. `npm run build` is
      # ensure-chromium && vite build && prerender, and the prerender step is
      # what writes dist/<route>.html -- the files a crawler that does not
      # run JavaScript actually reads. Cloudflare Pages' own Git build runs the
      # prerender (see the header of scripts/ensure-chromium.mjs, which exists
      # because that step once failed there and took the deploy with it), so CI
      # was building a DIFFERENT artifact from the one the site is built from --
      # and this job's artifact is what the e2e job downloads. Nothing here
      # deploys: Cloudflare Pages builds from its own Git integration.
      # See docs/deployment-checklist.md.
      #
      # It also means every guardrail in scripts/prerender.mjs now runs on every
      # PR instead of only at deploy: the per-route canonical anchor, the body
      # floor, and the structured-data check added after a sampled 1-in-6 chance
      # of publishing the homepage with none of its Helmet-managed schema. A
      # prerender regression can now fail this job. That is the point, and it is
      # a real behaviour change: before, nothing here could catch one.
      - name: Build
        run: npm run build
        env:
          # Vite INLINES these into the bundle at build time, and the same
          # dist/ artifact is what the e2e job tests. So the
          # build must use the REAL anon key — otherwise production serves a
          # client whose apikey is a placeholder and every request (including
          # sign-in) fails with 401 "Invalid API key". The anon key is public
          # by design. PR/fork builds (no secret access) fall back to the
          # placeholder; they never deploy.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://api.tryeatpal.com' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-for-ci-build' }}
          VITE_FUNCTIONS_URL: ${{ secrets.VITE_FUNCTIONS_URL }}

      # US-775. vite.config.ts's chunking is empirically derived scar tissue --
      # every rule in it names a production breakage it prevents -- and until
      # now nothing measured the result, so a change that moved a megabyte into
      # the entry bundle shipped looking like one that helped. Budgets and the
      # measured baseline are in .ci/bundle-budget.{json,md}.
      - name: Check bundle budget
        run: node scripts/ci/check-bundle-budget.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # US-764. The 28 spec files under tests/ existed for months and no workflow
  # ran any of them. That was not simple neglect: switching this on before the
  # story would have failed instantly and taught nobody anything, because
  # tests/mobile-responsive.spec.ts had a collection error that aborted the
  # whole run, and 20 specs hardcoded http://localhost:8080 and so ignored the
  # baseURL this job's server listens on.
  #
  # Runs against the SAME dist/ artifact the build job produced and
  # the Build job uploads, not a rebuild -- an e2e job that tests a
  # different artifact from the one that ships is worse than none.
  #
  # Only tests/*.spec.ts. tests/functions/** drives DEPLOYED edge functions over
  # the network and already runs in types-and-functions; tests/accessibility/
  # arrives with US-778, which owns the axe threshold and the authenticated
  # pages. The 15 backend-dependent specs skip themselves through
  # tests/helpers/requires-backend.ts and run when E2E_BACKEND is set.
  #
  # continue-on-error until 2026-09-17: two known-red results are real product
  # findings, not flakes, and neither is this job's to fix -- the homepage meta
  # description is 214 characters against Google's ~160 truncation, and
  # tests/accessibility carries genuine contrast violations. Flip this to false
  # on that date; if the findings are still open by then they are overdue, not
  # a reason to extend.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Resolves an existing browser before reaching for a download, and fails
      # loudly rather than silently launching nothing. Same helper the build
      # uses, so both run the same Chromium.
      - name: Resolve or install Chromium
        run: node scripts/ensure-chromium.mjs

      # US-855. Two vitest files assert things about a BUILT site -- the heading
      # outline of every prerendered page, and whether dist/_headers carries the
      # CSP script hashes -- and both open with "if a dist is present". The unit
      # job has no dist/, so both took the skip path on every run: present as
      # coverage, executed never. This is the job that has the artifact, so this
      # is where they have to run.
      - name: Dist-dependent unit gates
        run: npx vitest run src/lib/headingOutline.test.ts src/lib/cspInlineScripts.test.ts

      # E2E_TARGET=dist makes playwright.config.ts serve the downloaded dist/
      # through scripts/dev/serve-dist.mjs on 4173, which resolves URLs the way
      # Cloudflare Pages does -- prerendered dist/<route>.html first,
      # SPA fallback after. `npm run dev` would test a different resolver.
      - name: Run Playwright
        run: npx playwright test --project=chromium tests/*.spec.ts
        env:
          E2E_TARGET: dist

      # US-778. The scan in tests/accessibility/a11y.spec.ts covers marketing
      # pages only -- the half of the app nobody is signed into. Every screen a
      # parent actually uses had never been scanned, because no browser test
      # could get past ProtectedRoute.
      #
      # Needs its own build: the dist/ artifact is built without Supabase
      # credentials, so the app instantiates a MOCK client that has no session
      # to restore and every authenticated route redirects to /auth. This build
      # points at the local fake backend instead, and tests/helpers/auth.ts
      # writes the session into localStorage before the app boots.
      - name: Build against the fake backend
        run: npx vite build --outDir dist-e2e
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54999
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.fake-for-e2e-only

      - name: Accessibility scan of authenticated pages
        run: |
          node scripts/dev/fake-postgrest.mjs &
          sleep 2
          npx playwright test --project=chromium tests/accessibility/authenticated-a11y.spec.ts
        env:
          E2E_TARGET: dist
          E2E_DIST: dist-e2e

      # US-768. The a11y scan above runs at desktop width, so a defect that only
      # exists on a phone is invisible to it -- the settings tabs hid every
      # label below 640px and left five buttons whose only content was an
      # aria-hidden icon, and the desktop scan reported that page clean.
      # A gate that only ever looks at one viewport is not looking at the phone.
      - name: Phone-width checks on the authenticated pages
        run: |
          node scripts/dev/fake-postgrest.mjs &
          sleep 2
          npx playwright test --project=chromium tests/responsive/
        env:
          E2E_TARGET: dist
          E2E_DIST: dist-e2e

      # US-856. Nothing watched the browser console behind the login, and
      # /dashboard/pantry was throwing ReferenceError into the route error
      # boundary for every account whose pantry was empty -- every new account,
      # on the fourth item in the sidebar. This step is the behavioural half of
      # that fix; the typecheck ratchet holds the error class that caused it.
      - name: Signed-in routes render without throwing
        run: |
          node scripts/dev/fake-postgrest.mjs &
          sleep 2
          npx playwright test --project=chromium tests/authenticated/
        env:
          E2E_TARGET: dist
          E2E_DIST: dist-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      # US-547: fail on NEW duplicate migration version prefixes (before spending
      # time booting Supabase). Pre-existing dupes are grandfathered in-script.
      - name: Check migration version prefixes
        run: bash scripts/ci/check-migration-prefixes.sh

      # US-654: report the schema the migrations on disk describe. With no
      # SCHEMA_SNAPSHOT configured this reports the repo-side expectation and
      # exits 0, so it is safe on every commit. It only compares against a real
      # database when an operator supplies a snapshot, because this repo has no
      # pg dependency and CI holds no database credential.
      - name: Schema drift report
        run: node scripts/ci/schema-drift-report.mjs

      - uses: supabase/setup-cli@v1
        with:
          # US-760: pinned, not `latest`. Both Supabase jobs run the same
          # version, and a CLI release cannot red this pipeline without a
          # commit in this repo. Bump deliberately.
          version: 2.116.0

      # US-760: `supabase start` aborts in under two seconds when a path in
      # config.toml does not resolve, and from the run list that is
      # indistinguishable from Docker failing to come up. Name the failure
      # before spending a minute booting containers.
      - name: Validate supabase config
        run: node scripts/ci/check-supabase-config.mjs

      - name: Start local Supabase
        run: supabase start --exclude gotrue,storage-api,imgproxy,inbucket,postgrest,realtime,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations
        run: supabase db push --local

      # US-793: supabase/tests/*.test.sql existed for months with nothing
      # running them (US-780's notes record its 11 cases as never executed,
      # blocked on "no Postgres in the container"). US-760 fixed
      # `supabase start`, so they can run here now. \set ON_ERROR_STOP makes
      # each file fail the step rather than print and continue.
      #
      # continue-on-error: true for now. Measured against a fresh `supabase db
      # reset` schema: us793 passes, but us668, us711, us780 and us784 all
      # fail. Running each one's .bootstrap.sql first does not help -- the
      # bootstraps themselves fail with "permission denied for schema auth"
      # because the local `postgres` role is not a superuser (usesuper = f),
      # and CI connects with the same DB_URL. Turning this blocking now would
      # red the Migration Test job -- only repaired today -- on failures owned
      # by other stories. Tracked as US-800; drop continue-on-error once those
      # four pass. This mirrors what US-764 already does for the E2E job.
      - name: Run SQL tests
        continue-on-error: true
        run: |
          DB_URL="$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')"
          shopt -s nullglob
          for f in supabase/tests/*.test.sql; do
            echo "--- $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  types-and-functions:
    name: Types Drift & Edge Functions
    runs-on: ubuntu-latest
    # Intentionally independent of `quality`: this job only gathers
    # schema/type/edge-function signal and uploads artifacts (it gates
    # nothing), so the repo's pre-existing lint debt must not skip it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Fast, hermetic unit tests for the shared edge-function security helpers
      # (auth/household/admin/rate-limit/validation/price-allowlist). No DB needed.
      - name: Deno helper unit tests
        run: deno test functions/_shared/helpers_test.ts

      # US-533: static guard that every verify_jwt=false function enforces its
      # own auth in-source (reads config.toml + function sources).
      - name: Deno verify_jwt enforcement guard
        run: deno test --allow-read functions/_shared/verify-jwt-guard_test.ts

      # US-710: SSRF, redirect-cap and body-size guards on the recipe URL
      # fetch. Every case injects fetchImpl and uses IP literals, so no network
      # and no DNS -- hence no --allow-net.
      - name: Deno recipe-fetch SSRF guards
        run: deno test supabase/functions/_shared/url-validator.test.ts

      # US-716: the meal-plan-template transforms -- building plan_entries rows
      # (user_id, allergen skips, recipe-only routing) and folding a planned
      # week back into template entries. Pure, no network, no DB.
      - name: Deno meal-plan template transforms
        run: deno test supabase/functions/_shared/meal-plan-templates.test.ts

      # US-783: these payloads carry child PII. The OpenAI request must send
      # store:false, and the Anthropic one must NOT carry an invented
      # retention field -- the Messages API has no per-request equivalent, so
      # sending one would read as compliance without being any.
      # --allow-net is for the supabase import the module pulls at check time;
      # the test itself stubs fetch and reaches no provider.
      - name: Deno AI retention flags
        run: deno test --allow-env --allow-net supabase/functions/_shared/ai-retention.test.ts

      # US-797: barcode-to-catalog promotion decision (unit + range sanity,
      # name normalization matching the shipped iOS normalizer, verification
      # always 'unverified'). Pure, no network, no DB. This step is the fix
      # for US-792: the test file existed for a full commit with nothing
      # here running it.
      - name: Deno barcode catalog promotion
        run: deno test supabase/functions/_shared/catalogPromotion.test.ts

      # US-806: who parse-recipe lets in. Pins that an anon-key caller (every
      # shipped iOS share extension, deep link and Shortcuts intent) is served
      # rather than 401'd, and that the anon allowance stays capped per-address
      # and globally. Pure, no network, no DB.
      - name: Deno parse-recipe access budget
        run: deno test supabase/functions/_shared/parse-recipe-access.test.ts

      # The image-generation helper: prompt construction, b64 decode-and-store,
      # and provider errors surfacing as throws. Five passing cases that no
      # workflow had ever invoked -- found by generalizing the US-792 wiring
      # gate in src/lib/ciGatesWired.test.ts to enumerate _shared/ rather than
      # naming one file. --allow-net is for the supabase import resolved at
      # check time; the test stubs fetch and reaches no provider.
      - name: Deno image generation helper
        run: deno test --allow-env --allow-net supabase/functions/_shared/image-gen.test.ts

      - uses: supabase/setup-cli@v1
        with:
          # US-760: pinned, not `latest`. Both Supabase jobs run the same
          # version, and a CLI release cannot red this pipeline without a
          # commit in this repo. Bump deliberately.
          version: 2.116.0

      # Full stack (db + auth + edge-runtime) so the edge-function suite
      # has live endpoints to hit. Heavier than migration-test on purpose.
      # US-760: `supabase start` aborts in under two seconds when a path in
      # config.toml does not resolve, and from the run list that is
      # indistinguishable from Docker failing to come up. Name the failure
      # before spending a minute booting containers.
      - name: Validate supabase config
        run: node scripts/ci/check-supabase-config.mjs

      - name: Start local Supabase
        run: supabase start --exclude imgproxy,logflare,vector,supavisor

      - name: Apply migrations
        run: supabase db push --local

      # Regenerate types from the actual migrated schema. We do NOT fail
      # the pipeline on drift (the pinned-vs-latest CLI can reformat
      # cosmetically); instead we surface a clear annotation + upload the
      # freshly generated file so it can be diffed / committed verbatim.
      - name: Regenerate Supabase types
        run: |
          mkdir -p artifacts
          supabase gen types typescript --local > artifacts/types.generated.ts
          echo "Generated $(wc -l < artifacts/types.generated.ts) lines."

      # US-761: blocking. It was informational, and drifted to 113 missing
      # tables -- funnel_events, apple_subscriptions, stripe_webhook_events
      # and the rest -- because a warning nobody is forced to read is a
      # warning nobody reads. The step could not even run until US-760 fixed
      # the config path that killed `supabase start`.
      - name: Report type drift
        run: |
          if diff -q src/integrations/supabase/types.ts artifacts/types.generated.ts >/dev/null 2>&1; then
            echo "types.ts is in sync with migrations."
          else
            echo "::error::src/integrations/supabase/types.ts differs from the migrated schema. Download the 'supabase-types' artifact and commit it (or run: supabase gen types typescript --local > src/integrations/supabase/types.ts)."
            echo "----- tables present in regenerated types -----"
            grep -oE '^      [a-z_]+: \{' artifacts/types.generated.ts | sed -E 's/[ :{]//g' | sort | sed 's/^/  /'
            echo "----- unified diff (truncated to 400 lines) -----"
            diff -u src/integrations/supabase/types.ts artifacts/types.generated.ts | head -400 || true
            exit 1
          fi

      - name: Upload regenerated types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-types
          path: artifacts/types.generated.ts
          retention-days: 14

      # Edge-function suite is environment-sensitive (some functions need
      # provider secrets that don't exist in CI), so it is informational:
      # it never blocks the pipeline, but the JSON/HTML report is uploaded
      # so per-function pass/fail can drive the next iteration.
      # US-760: bounded, and no dev server. This step had never run -- the
      # Supabase jobs died before reaching it -- and the first run that got
      # here sat in it for forty minutes. These specs hit Supabase on 54321
      # through playwright's `request` fixture and none of them opens a page,
      # so PW_NO_WEBSERVER stops the config starting `npm run dev` for them.
      # timeout-minutes because continue-on-error does not bound a hang: an
      # unbounded step runs to the 6-hour job limit and the run never ends.
      - name: Run critical edge-function tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_edge_tests }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          CI: 'true'
          PW_NO_WEBSERVER: '1'
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_FUNCTIONS_URL: http://localhost:54321
        run: |
          # Map the local keys printed by `supabase status` into the names
          # the function test harness expects.
          eval "$(supabase status -o env | sed 's/^/export SB_/')"
          export VITE_SUPABASE_ANON_KEY="${SB_ANON_KEY:-$VITE_SUPABASE_ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SB_SERVICE_ROLE_KEY:-}"
          # --project=chromium, not the default. These are `request`-fixture
          # API tests, and without it playwright fans all six specs out over
          # five browser projects (chromium, firefox, webkit and two mobile),
          # with retries: 2 on each -- for tests that never open a browser, in
          # a job where only chromium is installed.
          npx playwright test --project=chromium tests/functions/critical/

      - name: Upload edge-function results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-function-results
          path: tests/functions/results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  security-sast:
    name: Security SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: false

      - name: Audit all dependencies (warnings only)
        run: npm audit --audit-level=high || true