# XcodeGen specification — single source of truth for the EatPal iOS project.
# Regenerate the Xcode project with:  xcodegen generate
# (Install: brew install xcodegen)

name: EatPal

options:
  bundleIdPrefix: com.eatpal
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: targeted
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      VALIDATE_PRODUCT: YES
      ENABLE_NS_ASSERTIONS: NO

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.0.0

targets:
  # -----------------------------------------------------------------
  # Main app
  # -----------------------------------------------------------------
  EatPal:
    type: application
    platform: iOS
    sources:
      - path: EatPal
        excludes:
          - "Resources/Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
          - "EatPal.entitlements"
      - path: Shared
    resources:
      - path: EatPal/Resources/Assets.xcassets
      - path: EatPal/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - target: EatPalWidgetExtension
        embed: true
        codeSign: true
      - target: EatPalShareExtension
        embed: true
        codeSign: true
      - target: EatPalWatch
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eatpal.app
        PRODUCT_NAME: EatPal
        INFOPLIST_FILE: EatPal/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: EatPal/EatPal.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "EatPal App Store"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: EatPal/EatPal-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  # -----------------------------------------------------------------
  # Share extension — "Share to EatPal" recipe URL import (US-143)
  # -----------------------------------------------------------------
  EatPalShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EatPalShare
        excludes:
          - "Info.plist"
          - "EatPalShareExtension.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: Shared
    resources:
      - path: EatPalShare/PrivacyInfo.xcprivacy
    info:
      path: EatPalShare/Info.plist
      properties:
        CFBundleDisplayName: EatPal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eatpal.app.share
        PRODUCT_NAME: EatPalShareExtension
        CODE_SIGN_ENTITLEMENTS: EatPalShare/EatPalShareExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "EatPal Share App Store"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # -----------------------------------------------------------------
  # Home-screen widget
  # -----------------------------------------------------------------
  EatPalWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EatPalWidget
        excludes:
          - "Info.plist"
          - "EatPalWidgetExtension.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: Shared
    resources:
      - path: EatPalWidget/PrivacyInfo.xcprivacy
    info:
      path: EatPalWidget/Info.plist
      properties:
        CFBundleDisplayName: EatPal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eatpal.app.widget
        PRODUCT_NAME: EatPalWidgetExtension
        CODE_SIGN_ENTITLEMENTS: EatPalWidget/EatPalWidgetExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "EatPal Widget App Store"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # -----------------------------------------------------------------
  # watchOS companion app (US-237) — Today + Grocery screens fed by
  # WatchConnectivity; embedded in the iPhone app.
  # -----------------------------------------------------------------
  EatPalWatch:
    type: application
    platform: watchOS
    sources:
      - path: "EatPalWatch Watch App"
        excludes:
          - "Info.plist"
          - "Complications/**"
          - "README.md"
          - "EatPalWatch.entitlements"
          - "EatPalWatchComplications.entitlements"
      # Shared payload model — the one file that must compile in both the
      # iPhone and watch processes. The rest of Shared/ pulls in
      # Supabase/ActivityKit and must NOT be added to the watch targets.
      - path: Shared/WatchSnapshot.swift
    info:
      path: "EatPalWatch Watch App/Info.plist"
      properties:
        CFBundleDisplayName: EatPal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        # Links the watch app to its iOS companion; the simulator refuses to
        # install the embedded watch app without it ("Missing
        # WKCompanionAppBundleIdentifier key in WatchKit 2.0 app's Info.plist").
        WKCompanionAppBundleIdentifier: com.eatpal.app
    dependencies:
      - target: EatPalWatchComplications
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eatpal.app.watchkitapp
        PRODUCT_NAME: EatPalWatch
        # Pin the SDK so the iOS scheme embedding this app still builds it for
        # watchOS (not the iOS Simulator destination it's embedded under).
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        CODE_SIGN_ENTITLEMENTS: "EatPalWatch Watch App/EatPalWatch.entitlements"
        PROVISIONING_PROFILE_SPECIFIER: "EatPal Watch App Store"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  # -----------------------------------------------------------------
  # watchOS complications (WidgetKit) — Tonight + Grocery; embedded in
  # the watch app. Separate target because it has its own @main WidgetBundle.
  # -----------------------------------------------------------------
  EatPalWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: "EatPalWatch Watch App/Complications/EatPalWatchComplications.swift"
      - path: Shared/WatchSnapshot.swift
    info:
      path: "EatPalWatch Watch App/Complications/Info.plist"
      properties:
        CFBundleDisplayName: EatPal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eatpal.app.watchkitapp.complications
        PRODUCT_NAME: EatPalWatchComplications
        # Pin the SDK so this extension builds for watchOS even though the
        # iOS scheme pulls it in transitively (via the embedded watch app).
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        CODE_SIGN_ENTITLEMENTS: "EatPalWatch Watch App/EatPalWatchComplications.entitlements"
        PROVISIONING_PROFILE_SPECIFIER: "EatPal Watch Complications App Store"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # -----------------------------------------------------------------
  # Unit tests
  # -----------------------------------------------------------------
  EatPalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EatPalTests
    dependencies:
      - target: EatPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eatpal.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EatPal.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EatPal"

schemes:
  EatPal:
    build:
      targets:
        EatPal: all
        EatPalWidgetExtension: all
        EatPalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EatPalTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
