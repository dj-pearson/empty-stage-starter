# DO NOT UNCOMMENT ANYTHING IN THIS FILE. It is deliberately empty.
#
# tryeatpal.com is built and deployed by the Cloudflare Pages Git integration,
# configured in the Cloudflare dashboard. It is the only deploy path. CI builds
# and tests the artifact; it does not ship it (US-762).
#
# This file has to keep existing and keep saying nothing, and that is not a
# tidiness preference -- it is load-bearing:
#
#   With every line commented out, Pages finds no build configuration and falls
#   back to the dashboard settings, which is how the site actually deploys.
#   Uncommenting `pages_build_output_dir` in August 2026 switched Pages into
#   full configuration-file validation, which then demanded a top-level `name`
#   that is also commented out:
#
#     ERROR Running configuration file validation for Pages:
#       - Missing top-level field "name" in configuration file.
#     Failed: unable to read the Wrangler configuration file with code: 1
#
#   That broke the deploy it was meant to fix. Reverted in 36ec2f3b.
#
# The commented `name` below reads "eatpal-empty-stage" while the CI job that
# used to run here passed --project-name=eatpal. They disagree, and only the
# dashboard settles which is right -- which is the second reason not to
# uncomment either one from a guess.
#
# US-762 offered deleting this file instead. Keeping it is the safer half of
# that choice: an absent file and an empty file should behave identically to
# Pages, but "should" is doing real work in a sentence about the production
# deploy, and an empty file with this comment stops the next person
# re-creating a populated one. Delete it only with the dashboard open.
#
# name = "eatpal-empty-stage"
# compatibility_date = "2024-12-19"
# pages_build_output_dir = "dist"

